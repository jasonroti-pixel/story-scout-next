name: Ingest Stories

on:
  schedule:
    # Mon–Fri 09:30 America/Toronto
    # EDT (UTC-4): 13:30 UTC | EST (UTC-5): 14:30 UTC — use 13:30 (EDT) + 14:30 (EST)
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    # Mon–Fri 23:30 America/Toronto
    # EDT: 03:30 UTC next day | EST: 04:30 UTC next day
    - cron: "30 3 * * 2-6"
    - cron: "30 4 * * 2-6"
    # Sunday 23:30 America/Toronto
    - cron: "30 3 * * 1"
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Run ingest pipeline
        working-directory: pipeline
        run: python ingest.py --no-fulltext
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit stories.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories.json
          if git diff --staged --quiet; then
            echo "No story changes to commit"
          else
            git commit -m "chore(ingest): refresh data/stories.json [skip ci]"
            git push
          fi
