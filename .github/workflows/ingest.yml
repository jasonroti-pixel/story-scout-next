name: Ingest Stories

on:
  # NOTE (2026-10-19): GitHub's cron scheduler fired these 4-8 hours late as
  # routine, and the old dual EDT/EST cron pairs fired every slot twice.
  # Scheduling moved off GitHub: an external scheduler triggers
  # workflow_dispatch at exactly 09:30 / 23:30 America/Toronto (DST-safe, so
  # no EDT/EST pair needed). ingest.py falls back to the wall clock for the
  # am/pm slot when INGEST_SCHEDULE is empty, which is correct for on-time
  # triggers (am before 15:00 Toronto, pm after).
  workflow_dispatch:

permissions:
  contents: write

# One ingest at a time: overlapping runs race on the stories.json push
# (2026-09-28: two scheduled runs overlapped and the later one's push was
# rejected as non-fast-forward). Queued runs check out fresh main, so each
# run builds on the previous run's pushed stories.
concurrency:
  group: ingest-stories
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Run ingest pipeline
        working-directory: pipeline
        run: python ingest.py --no-fulltext
        env:
          PYTHONUNBUFFERED: "1"
          # The cron expression that triggered this run (empty on
          # workflow_dispatch). ingest.py maps it to the intended am/pm slot
          # when present, else falls back to the wall clock, which is correct
          # for on-time external triggers.
          INGEST_SCHEDULE: ${{ github.event.schedule }}
          # Optional: when set, ingest fetches Jev features per story and uses
          # the stacked section model (0.62 test). Unset or failing -> the
          # text-only model (0.54) is used instead. The run never breaks.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      - name: Gemini writing pass
        run: python pipeline/gemini_enrich.py --input data/stories.json --limit 60
        env:
          PYTHONUNBUFFERED: "1"
          # Optional: when set, fresh stories get a Gemini-written angle /
          # bullets / debate pass in the show's voice. Unset -> the run
          # still succeeds and template copy stays in place.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit stories.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories.json
          if git diff --staged --quiet; then
            echo "No story changes to commit"
          else
            git commit -m "chore(ingest): refresh data/stories.json"
            # Rebase onto anything pushed while this run was working (another
            # queued run, a manual push, or Jay's jev-enrich), so the push
            # below is fast-forward. If the rebase conflicts, bail out cleanly:
            # the next scheduled run re-fetches and re-merges everything.
            if git pull --rebase origin main; then
              git push
            else
              git rebase --abort || true
              echo "Remote moved during run and rebase conflicted; skipping push. Next run will pick up fresh stories."
            fi
          fi
